name: ratchasima
description: "A new Flutter project."
publish_to: 'none'

version: 0.0.1+3

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  dio: ^5.8.0+1
  firebase_auth: ^5.3.4
  firebase_core: ^3.15.2
  flutter_html: ^3.0.0
  flutter_datetime_picker_plus: ^2.0.0
  flutter_facebook_auth: ^7.1.1
  flutter_line_sdk: ^2.6.2
  flutter_secure_storage: ^9.2.4
  flutter_slidable: ^3.0.0
  fluttertoast: ^8.2.4
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.0.0
  google_sign_in: ^6.2.2
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  permission_handler: ^11.3.1
  photo_view: ^0.15.0
  pull_to_refresh: ^2.0.0
  qr_flutter: ^4.0.0
  share_plus: ^7.2.2
  sign_in_with_apple: ^6.1.4
  sliding_up_panel: ^2.0.0+1
  table_calendar: ^3.0.3
  url_launcher: ^6.1.5
  smooth_page_indicator: ^1.2.1
  fading_edge_scrollview: ^4.1.1
  badges: ^3.1.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

dependency_overrides:
  html: 0.15.6
  csslib: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/logoApp.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo/
    - assets/icons/
    - assets/background/
    - assets/logo/icons/
    - assets/images/
    - assets/logo/socials/

  fonts:
    - family: Charmonman
      fonts:
        - asset: assets/fonts/Charmonman-Regular.ttf
        - asset: assets/fonts/Charmonman-Bold.ttf

    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Light.ttf
        - asset: assets/fonts/Kanit-Medium.ttf
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-SemiBold.ttf

    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Bold.ttf
        - asset: assets/fonts/Sarabun-Light.ttf
        - asset: assets/fonts/Sarabun-Medium.ttf
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Thin.ttf

    - family: Mitr
      fonts:
        - asset: assets/fonts/Mitr-Bold.ttf
        - asset: assets/fonts/Mitr-Regular.ttf
